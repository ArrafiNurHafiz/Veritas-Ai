# Alembic configuration for VERITAS AI enterprise schema.
# Run from the repository root:
#   alembic -c enterprise/alembic.ini upgrade head
# The database URL is read from DATABASE_URL in enterprise/migrations/env.py.
[alembic]
script_location = %(here)s/migrations
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
