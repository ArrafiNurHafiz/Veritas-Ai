# =============================================================================
# VERITAS AI — Real Odoo 17 Community Edition (Accounting, Purchase, MRP)
# Usage:
#   docker compose -f docker-compose.odoo.yml up -d
#   python3 scripts/setup_odoo.py
# =============================================================================

services:
  odoo_db:
    image: docker.io/library/postgres:16-alpine
    container_name: veritas-odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo_veritas_2036}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  odoo:
    image: docker.io/library/odoo:17
    container_name: veritas-odoo
    depends_on:
      odoo_db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: odoo_db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo_veritas_2036}
    volumes:
      - odoo-web-data:/var/lib/odoo
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
