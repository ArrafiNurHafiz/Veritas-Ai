services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veritas}
      POSTGRES_USER: ${POSTGRES_USER:-veritas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veritas-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritas} -d ${POSTGRES_DB:-veritas}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [db_net]

  agent:
    build: .
    entrypoint: ["uvicorn"]
    command: ["agent_service:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      VERITAS_AGENT_TOKEN: ${VERITAS_AGENT_TOKEN:-dev-agent-token}
      VERITAS_LLM_BASE_URL: ${VERITAS_LLM_BASE_URL:-}
      VERITAS_LLM_API_KEY: ${VERITAS_LLM_API_KEY:-}
      VERITAS_LLM_MODEL: ${VERITAS_LLM_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      VERITAS_PUBLIC_URL: ${VERITAS_PUBLIC_URL:-http://localhost:8090}
      VERITAS_CORS_ORIGINS: ${VERITAS_CORS_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090}
      VERITAS_EXPIRY_SWEEP_SECONDS: ${VERITAS_EXPIRY_SWEEP_SECONDS:-15}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Strictly isolated: cannot reach Postgres, Frontend, Caddy, or external internet.
    networks: [agent_net]

  enterprise:
    build:
      context: .
      dockerfile: enterprise/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-veritas}:${POSTGRES_PASSWORD:-veritas-local}@postgres:5432/${POSTGRES_DB:-veritas}
      VERITAS_SESSION_STORE: ${VERITAS_SESSION_STORE:-postgres}
      VERITAS_SIGNING_SEED: ${VERITAS_SIGNING_SEED:-2222222222222222222222222222222222222222222222222222222222222222}
      VERITAS_INTERNAL_TOKEN: ${VERITAS_INTERNAL_TOKEN:-dev-internal}
      VERITAS_LOG_JSON: ${VERITAS_LOG_JSON:-1}
      VERITAS_AGENT_URL: http://agent:8001
      VERITAS_AGENT_TOKEN: ${VERITAS_AGENT_TOKEN:-dev-agent-token}
      VERITAS_BOOTSTRAP_TENANT_ID: ${VERITAS_BOOTSTRAP_TENANT_ID:-default}
      VERITAS_BOOTSTRAP_TENANT_NAME: ${VERITAS_BOOTSTRAP_TENANT_NAME:-Default Tenant}
      VERITAS_SSO_BYPASS: ${VERITAS_SSO_BYPASS:-1}
      VERITAS_KMS_BYPASS: ${VERITAS_KMS_BYPASS:-1}
      VERITAS_COOKIE_SECURE: ${VERITAS_COOKIE_SECURE:-0}
      VERITAS_AUTH_TEST_MODE: ${VERITAS_AUTH_TEST_MODE:-true}
      VERITAS_TEST_IDENTITY_JSON: '${VERITAS_TEST_IDENTITY_JSON:-{"user_id":"local-admin","tenant_id":"default","roles":["admin"]}}'
      VERITAS_PUBLIC_URL: ${VERITAS_PUBLIC_URL:-http://localhost:8090}
      VERITAS_CORS_ORIGINS: ${VERITAS_CORS_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090}
      VERITAS_EXPIRY_SWEEP_SECONDS: ${VERITAS_EXPIRY_SWEEP_SECONDS:-15}
      VERITAS_ERP_ADAPTER: ${VERITAS_ERP_ADAPTER:-webhook}
      VERITAS_ERP_WEBHOOK_URL: ${VERITAS_ERP_WEBHOOK_URL:-http://erp_sandbox:8003/api/erp/webhook}
      VERITAS_ERP_API_KEY: ${VERITAS_ERP_API_KEY:-}
      VERITAS_ERP_HMAC_SECRET: ${VERITAS_ERP_HMAC_SECRET:-}
      VERITAS_ODOO_DB: ${VERITAS_ODOO_DB:-veritas_odoo}
      VERITAS_ODOO_USERNAME: ${VERITAS_ODOO_USERNAME:-admin}
      VERITAS_ODOO_PASSWORD: ${VERITAS_ODOO_PASSWORD:-admin}
      VERITAS_ODOO_API_KEY: ${VERITAS_ODOO_API_KEY:-}
      VERITAS_ALLOW_INSECURE_WEBHOOKS: ${VERITAS_ALLOW_INSECURE_WEBHOOKS:-1}
      VERITAS_WEBHOOK_ALLOW_HOSTS: ${VERITAS_WEBHOOK_ALLOW_HOSTS:-erp_sandbox}
      SMTP_HOST: ${SMTP_HOST:-mail_sandbox}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@veritas.local}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-0}
      VERITAS_APPROVAL_NOTIFY_EMAILS: ${VERITAS_APPROVAL_NOTIFY_EMAILS:-approver@veritas.local,admin@veritas.local}
      VERITAS_ANCHOR_RPC_URL: ${VERITAS_ANCHOR_RPC_URL:-}
      VERITAS_ANCHOR_FROM: ${VERITAS_ANCHOR_FROM:-}
      VERITAS_ANCHOR_CONTRACT: ${VERITAS_ANCHOR_CONTRACT:-}
      VERITAS_LLM_BASE_URL: ${VERITAS_LLM_BASE_URL:-}
      VERITAS_LLM_API_KEY: ${VERITAS_LLM_API_KEY:-}
      VERITAS_LLM_MODEL: ${VERITAS_LLM_MODEL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [db_net, agent_net, edge_net]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_VERITAS_MODE: enterprise
        NEXT_PUBLIC_VERITAS_TEST_MODE: ${NEXT_PUBLIC_VERITAS_TEST_MODE:-1}
        HARNESS_URL: http://enterprise:8100
    environment:
      HARNESS_URL: http://enterprise:8100
      NEXT_PUBLIC_HARNESS_URL: http://enterprise:8100
    depends_on:
      enterprise:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [edge_net]

  erp_sandbox:
    build: .
    entrypoint: ["uvicorn"]
    command: ["erp_sandbox.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      ERP_SANDBOX_DB: /data/erp_sandbox.db
      VERITAS_HARNESS_URL: http://enterprise:8100
      ERP_SANDBOX_API_KEY: ${ERP_SANDBOX_API_KEY:-${VERITAS_ERP_API_KEY:-}}
      ERP_SANDBOX_HMAC_SECRET: ${ERP_SANDBOX_HMAC_SECRET:-${VERITAS_ERP_HMAC_SECRET:-}}
    volumes:
      - erpdata:/data
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [edge_net]

  mail_sandbox:
    build: .
    entrypoint: ["uvicorn"]
    command: ["mail_sandbox.server:app", "--host", "0.0.0.0", "--port", "8025"]
    environment:
      MAIL_SANDBOX_DB: /data/mail_sandbox.db
      MAIL_SANDBOX_SMTP_HOST: "0.0.0.0"
      MAIL_SANDBOX_SMTP_PORT: "1025"
    volumes:
      - maildata:/data
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8025/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [edge_net]

  caddy:
    image: docker.io/library/caddy:2-alpine
    environment:
      VERITAS_SITE_ADDRESS: ${VERITAS_SITE_ADDRESS:-:80}
    ports:
      - "${VERITAS_HTTP_PORT:-8090}:80"
      - "${VERITAS_HTTPS_PORT:-8443}:443"
    volumes:
      - ./enterprise/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge_net]

volumes:
  pgdata:
  erpdata:
  maildata:
  caddy-data:
  caddy-config:

networks:
  db_net:
    internal: true
  agent_net:
    internal: true
  edge_net:
