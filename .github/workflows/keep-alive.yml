name: Keep Hugging Face Spaces Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping VERITAS Backend Space
        if: ${{ vars.VERITAS_BACKEND_URL != '' }}
        run: curl -fsSL --max-time 60 "${{ vars.VERITAS_BACKEND_URL }}/health/live"

      - name: Ping VERITAS Odoo Space
        if: ${{ vars.VERITAS_ODOO_URL != '' }}
        run: curl -fsSL --max-time 60 "${{ vars.VERITAS_ODOO_URL }}/web/login" >/dev/null
